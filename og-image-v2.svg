<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 1. 배경: 깔끔한 플랫 다크 슬레이트 (#0f172a) -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- 2. 중앙 메인 컨텐츠 (서브텍스트 제거, 뱃지와 둥글둥글한 타이틀 중심) -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- 아이콘 뱃지 (180x180, rx=40, 플랫 단색 #10b981) -->
    <g transform="translate(-90, 145)">
      <rect width="180" height="180" rx="40" fill="#10b981"/>
      
      <!-- 세모, 동그라미, 네모 (각 약 50px 비중, 간격 7px로 오밀조밀 모인 배치) -->
      <!-- 1. 상단 세모 -->
      <polygon points="90,41 115,84 65,84"
               fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 2. 하단 좌측 동그라미 (지름 50px, r=25) -->
      <circle cx="62" cy="119" r="25" fill="#ffffff"/>

      <!-- 3. 하단 우측 네모 (50px x 50px, rx=10) -->
      <rect x="94" y="94" width="50" height="50" rx="10" fill="#ffffff"/>
    </g>

    <!-- 메인 타이틀: 가치아케이드 (둥글둥글하고 도톰한 두께감) -->
    <text x="0" y="415"
          fill="#ffffff"
          stroke="#ffffff"
          stroke-width="3.5"
          stroke-linejoin="round"
          stroke-linecap="round"
          font-family="'Jua', 'NanumSquareRound', 'Pretendard Round', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="76"
          font-weight="900"
          letter-spacing="-1px">
      가치아케이드
    </text>
  </g>
</svg>
