<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#1b4d2e"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 베이스 둥근 사각형 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- 내부 네온 테두리 -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#68d391" stroke-width="8" stroke-opacity="0.4"/>

  <!-- 게임패드 바디 -->
  <g filter="url(#glow)">
    <rect x="76" y="166" width="360" height="210" rx="90" fill="url(#padGrad)"/>

    <!-- 십자키 (D-Pad) -->
    <rect x="136" y="246" width="70" height="24" rx="6" fill="#2d3748"/>
    <rect x="159" y="223" width="24" height="70" rx="6" fill="#2d3748"/>
    <circle cx="171" cy="258" r="4" fill="#718096"/>

    <!-- 액션 버튼 4개 (A, B, X, Y 컬러) -->
    <circle cx="340" cy="235" r="13" fill="#e53e3e"/> <!-- Red Y -->
    <circle cx="370" cy="258" r="13" fill="#3182ce"/> <!-- Blue B -->
    <circle cx="310" cy="258" r="13" fill="#dd6b20"/> <!-- Orange X -->
    <circle cx="340" cy="281" r="13" fill="#38a169"/> <!-- Green A -->

    <!-- 중앙 스타트/셀렉트 캡슐 -->
    <rect x="232" y="260" width="18" height="8" rx="4" fill="#a0aec0" transform="rotate(-25 241 264)"/>
    <rect x="262" y="260" width="18" height="8" rx="4" fill="#a0aec0" transform="rotate(-25 271 264)"/>

    <!-- 상단 범퍼 LED 인디케이터 -->
    <circle cx="256" cy="205" r="6" fill="#48bb78"/>
  </g>
</svg>
