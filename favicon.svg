<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 가치아케이드 고유 컬러 플랫 단색 배경 -->
  <rect width="512" height="512" rx="112" fill="#10b981"/>

  <!-- 큼직하고 오밀조밀하게 모인 세모, 동그라미, 네모 (각 140px 비중, 간격 20px) -->
  <g fill="#ffffff">
    <!-- 1. 상단 세모 (외곽 높이 140px, 외곽 너비 160px) -->
    <polygon points="256,115 327,237 185,237"
             stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 2. 하단 좌측 동그라미 (지름 140px, r=70) -->
    <circle cx="176" cy="336" r="70"/>

    <!-- 3. 하단 우측 네모 (140px x 140px, rx=28) -->
    <rect x="266" y="266" width="140" height="140" rx="28"/>
  </g>
</svg>
