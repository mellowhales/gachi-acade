<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#14291e"/>
      <stop offset="100%" stop-color="#0b1b13"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48bb78"/>
      <stop offset="100%" stop-color="#38a169"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#48bb78" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 배경 다크 그라디언트 -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- 배경 네온 서클 장식 -->
  <circle cx="950" cy="200" r="320" fill="#48bb78" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="260" fill="#38a169" fill-opacity="0.1" filter="blur(50px)"/>

  <!-- 메인 글래스모피즘 카드 컨테이너 -->
  <g filter="url(#shadow)">
    <rect x="80" y="65" width="1040" height="500" rx="32" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- 상단 태그 뱃지 -->
  <g transform="translate(130, 115)">
    <rect width="210" height="38" rx="19" fill="#22543d" stroke="#48bb78" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#48bb78"/>
    <text x="36" y="24" fill="#68d391" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" letter-spacing="1">SERVERLESS P2P</text>
  </g>

  <!-- 메인 타이틀 & 슬로건 -->
  <text x="130" y="225" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    P2P 미니 아케이드
  </text>
  
  <text x="130" y="280" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600">
    서버 없이 브라우저에서 친구와 즉시 즐기는 실시간 멀티플레이 웹 게임
  </text>

  <!-- 지원 게임 태그 칩들 -->
  <g transform="translate(130, 330)">
    <!-- 오목 -->
    <g transform="translate(0, 0)">
      <rect width="105" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="52" y="27" fill="#f1f5f9" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" text-anchor="middle">⚫ 오목</text>
    </g>
    <!-- 체스 -->
    <g transform="translate(115, 0)">
      <rect width="105" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="52" y="27" fill="#f1f5f9" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" text-anchor="middle">♟️ 체스</text>
    </g>
    <!-- 쿼리도 -->
    <g transform="translate(230, 0)">
      <rect width="120" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="60" y="27" fill="#f1f5f9" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" text-anchor="middle">🧱 쿼리도</text>
    </g>
    <!-- 끝말잇기 -->
    <g transform="translate(360, 0)">
      <rect width="130" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="65" y="27" fill="#f1f5f9" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" text-anchor="middle">💬 끝말잇기</text>
    </g>
    <!-- 사과게임 -->
    <g transform="translate(500, 0)">
      <rect width="130" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="65" y="27" fill="#f1f5f9" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" text-anchor="middle">🍎 사과게임</text>
    </g>
    <!-- 마인크래프트 -->
    <g transform="translate(640, 0)">
      <rect width="165" height="42" rx="10" fill="#22543d" stroke="#48bb78" stroke-width="1.5"/>
      <text x="82" y="27" fill="#68d391" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" text-anchor="middle">⛏️ 마인크래프트</text>
    </g>
  </g>

  <!-- 하단 4자리 숫자 방 입장 안내 바 -->
  <g transform="translate(130, 430)">
    <rect width="820" height="70" rx="16" fill="#0f172a" stroke="#22543d" stroke-width="2"/>
    <circle cx="45" cy="35" r="16" fill="#48bb78"/>
    <text x="45" y="41" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">4</text>
    <text x="80" y="42" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="19" font-weight="700">
      로그인 없이 4자리 번호만 공유하면 1초 만에 바로 멀티플레이 시작!
    </text>
  </g>

  <!-- 우측 게임패드 3D 비주얼 아이콘 -->
  <g transform="translate(860, 110)" filter="url(#glowGreen)">
    <rect width="180" height="180" rx="45" fill="url(#accentGrad)"/>
    <!-- 내부 패드 -->
    <rect x="25" y="55" width="130" height="75" rx="30" fill="#ffffff"/>
    <!-- D-pad -->
    <rect x="45" y="85" width="28" height="9" rx="2" fill="#1e293b"/>
    <rect x="54.5" y="75.5" width="9" height="28" rx="2" fill="#1e293b"/>
    <!-- Buttons -->
    <circle cx="120" cy="80" r="5" fill="#e53e3e"/>
    <circle cx="132" cy="90" r="5" fill="#3182ce"/>
    <circle cx="108" cy="90" r="5" fill="#dd6b20"/>
    <circle cx="120" cy="100" r="5" fill="#38a169"/>
  </g>
</svg>
