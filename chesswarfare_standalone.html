<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>체스 워페어 (Chess Warfare) - 16×16 전장 영토전</title>

  <!-- Pretendard & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- 스타일시트 -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chesswarfare.css?v=4.1" />

  <style>
    body {
      margin: 0;
      padding: 20px 10px;
      background: #f0f4f8;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #cw-standalone-app {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- 🌟 체스 워페어 독립형 컴포넌트 컨테이너 🌟 -->
  <div id="cw-standalone-app"></div>

  <!-- 사운드 및 체스 워페어 게임 스크립트 -->
  <script src="js/sound.js"></script>
  <script src="js/games/chesswarfare.js?v=4.1"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('cw-standalone-app');
      
      // 체스 워페어 초기화 (가상 로비 및 방 화면에서 시작)
      ChessWarfareGame.init(container, (isWin) => {
        console.log('[ChessWarfare] 게임 결과:', isWin ? '승리' : '패배');
      }, {
        players: [
          { id: 'host-player', name: '아케이드 마스터 (White)', isHost: true },
          { id: 'guest-player', name: '도전자 (Black)', isHost: false }
        ],
        myId: 'host-player',
        myNickname: '아케이드 마스터',
        isHost: true,
        isDevMode: true // 자유 조작 테스트 모드
      });
    });
  </script>
</body>
</html>
