<svg version="1.1" viewBox="0 0 976 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <pattern id="hwatuPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0.4"/>
      <circle cx="30" cy="30" r="6" fill="#f87171" opacity="0.35"/>
      <circle cx="0" cy="0" r="4" fill="#f87171" opacity="0.25"/>
      <circle cx="60" cy="0" r="4" fill="#f87171" opacity="0.25"/>
      <circle cx="0" cy="60" r="4" fill="#f87171" opacity="0.25"/>
      <circle cx="60" cy="60" r="4" fill="#f87171" opacity="0.25"/>
    </pattern>
  </defs>
  <!-- Card Base -->
  <rect x="16" y="16" width="944" height="1568" rx="72" ry="72" fill="#18181b" stroke="#27272a" stroke-width="12"/>
  <!-- Card Face Frame (Traditional Korean Hwatu Red) -->
  <rect x="44" y="44" width="888" height="1512" rx="52" ry="52" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="6"/>
  <!-- Diamond Pattern Infill -->
  <rect x="68" y="68" width="840" height="1464" rx="36" ry="36" fill="url(#hwatuPattern)"/>
  <!-- Inner Border Frame -->
  <rect x="76" y="76" width="824" height="1448" rx="32" ry="32" fill="none" stroke="#fca5a5" stroke-width="5" opacity="0.6"/>
  <rect x="96" y="96" width="784" height="1408" rx="20" ry="20" fill="none" stroke="#fca5a5" stroke-width="2.5" opacity="0.4"/>
  <!-- Center Emblem (Hwatu Sun Crest) -->
  <circle cx="488" cy="800" r="140" fill="#7f1d1d" stroke="#fca5a5" stroke-width="8" opacity="0.85"/>
  <circle cx="488" cy="800" r="110" fill="#991b1b" stroke="#fecaca" stroke-width="4" opacity="0.7"/>
  <text x="488" y="825" font-family="'Pretendard', sans-serif" font-size="82" font-weight="900" fill="#fef2f2" text-anchor="middle" letter-spacing="4">花</text>
</svg>